<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Anteprima su telefono — La Sputacchiera</title>
  <link rel="icon" type="image/png" href="../assets/logo-liquido.png">
  <style>
    @font-face { font-family: 'Roboto Mono'; font-style: normal; font-weight: 400 600; font-display: swap; src: url(../assets/fonts/roboto-mono-latin.woff2) format('woff2'); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #E9E2D4; color: #F3EEE4; font: 13px/1.4 "Roboto Mono", ui-monospace, Menlo, monospace; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.3rem 1.25rem; padding: 0.7rem 1rem; background: #541F2D; text-align: center; }
    .bar b { font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #D9B5B5; }
    .bar a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
    .stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 1.25rem; }
    /* a 390 x 844 screen, the size of a common iPhone; shorter if the window is shorter */
    iframe { width: 390px; max-width: 100%; height: min(844px, 100%); border: 0; border-radius: 28px; background: #F3EEE4;
      box-shadow: 0 0 0 10px #20242A, 0 18px 50px rgba(32, 36, 42, 0.35); }
  </style>
</head>
<body>
  <div class="bar" role="status">
    <b>Anteprima su telefono</b>
    <span>La bozza salvata, come la vede chi visita il sito dal telefono.</span>
    <a id="desktop" href="../index.html?anteprima">Vedi come su computer</a>
    <a href="./">Torna all’area riservata</a>
  </div>
  <div class="stage"><iframe id="phone" title="Il sito come appare su un telefono"></iframe></div>
  <script>
    // ?pagina=corsi.html#percorso-2 -> that page of the draft, inside the phone frame
    const q = new URLSearchParams(location.search);
    const [page, hash] = (q.get('pagina') || 'index.html').split('#');
    const safe = /^(index|corsi|chi-sono|privacy)\.html$/.test(page) ? page : 'index.html';
    const frame = document.getElementById('phone');
    frame.src = `../${safe}?anteprima&incornice${hash ? `#${hash}` : ''}`;
    // "Vedi come su computer" follows the page being looked at inside the phone
    const desktop = document.getElementById('desktop');
    frame.addEventListener('load', () => {
      try {
        const p = frame.contentWindow.location.pathname.split('/').pop() || 'index.html';
        desktop.href = `../${p}?anteprima`;
      } catch (e) {}
    });
  </script>
</body>
</html>
